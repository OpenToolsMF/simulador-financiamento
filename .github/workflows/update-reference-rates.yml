name: Update reference rates data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

permissions:
  contents: write

jobs:
  update-reference-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: reference-rates-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update TR Bacen JSON
        id: tr
        run: node scripts/update-tr-bacen.mjs

      - name: Update BCB credit rates JSON
        id: credit
        run: node scripts/update-bcb-credit-rates.mjs

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- assets/data/tr-bacen.json assets/data/bcb-credit-rates.json)" ]; then
            echo "Reference rates data is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/tr-bacen.json assets/data/bcb-credit-rates.json
          git commit -m "chore: update reference rates data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summarize reference rates update
        if: ${{ always() }}
        env:
          TR_OUTCOME: ${{ steps.tr.outcome }}
          CREDIT_OUTCOME: ${{ steps.credit.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          COMMIT_CHANGED: ${{ steps.commit.outputs.changed }}
          VEHICLE_PRESERVED: ${{ steps.credit.outputs.vehicle_preserved }}
        run: |
          if [ -f scripts/reference-rates-summary.mjs ]; then
            node scripts/reference-rates-summary.mjs
          else
            echo "Resumo indisponível: o checkout dos scripts não foi concluído." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-updated-site:
    needs: update-reference-rates
    if: needs.update-reference-rates.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.update-reference-rates.outputs.commit_sha }}
      deploy: true
    permissions:
      contents: read
      pages: write
      id-token: write
