<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The best day to make an extra payment</title>
  <desc id="desc">Timeline from the due date and payment through processing to a lower outstanding balance.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8f5"/>
      <stop offset="1" stop-color="#eaf5ee"/>
    </linearGradient>
    <linearGradient id="calendarTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#176b3a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#14532d" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1140" cy="32" r="168" fill="#d6eadc" opacity="0.75"/>
  <circle cx="42" cy="622" r="150" fill="#d6eadc" opacity="0.55"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="58" y="48" width="251" height="34" rx="17" fill="#d6eadc"/>
    <circle cx="77" cy="65" r="6" fill="#176b3a"/>
    <text x="93" y="71" fill="#14532d" font-size="15" font-weight="700" letter-spacing="1.2">GUIDE · MAPA DAS PARCELAS</text>

    <text x="58" y="139" fill="#14532d" font-size="50" font-weight="800" letter-spacing="-1.3">
      <tspan x="58" dy="0">The best day to make</tspan>
      <tspan x="58" dy="55">an extra payment</tspan>
    </text>
    <text x="58" y="244" fill="#667085" font-size="23">
      <tspan x="58" dy="0">There is no universal “due date + 1” rule.</tspan>
      <tspan x="58" dy="34" fill="#1f2937" font-weight="700">What matters is when the payment reduces the principal.</tspan>
    </text>

    <g transform="translate(930 46)" filter="url(#shadow)">
      <rect width="204" height="210" rx="26" fill="#ffffff" stroke="#b9d9c4" stroke-width="2"/>
      <path d="M0 26Q0 0 26 0H178Q204 0 204 26V62H0Z" fill="url(#calendarTop)"/>
      <rect x="42" y="-10" width="14" height="34" rx="7" fill="#d6eadc"/>
      <rect x="148" y="-10" width="14" height="34" rx="7" fill="#d6eadc"/>
      <g fill="#d6e2d9">
        <rect x="31" y="88" width="25" height="20" rx="5"/>
        <rect x="70" y="88" width="25" height="20" rx="5"/>
        <rect x="109" y="88" width="25" height="20" rx="5"/>
        <rect x="148" y="88" width="25" height="20" rx="5"/>
        <rect x="31" y="122" width="25" height="20" rx="5"/>
        <rect x="70" y="122" width="25" height="20" rx="5"/>
        <rect x="148" y="122" width="25" height="20" rx="5"/>
        <rect x="31" y="156" width="25" height="20" rx="5"/>
        <rect x="70" y="156" width="25" height="20" rx="5"/>
        <rect x="109" y="156" width="25" height="20" rx="5"/>
        <rect x="148" y="156" width="25" height="20" rx="5"/>
      </g>
      <rect x="104" y="116" width="36" height="32" rx="8" fill="#176b3a"/>
      <path d="M115 132l6 6 12-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="58" y="327" width="1084" height="246" rx="28" fill="#ffffff" stroke="#d6e2d9" stroke-width="2"/>
    </g>
    <text x="92" y="374" fill="#14532d" font-size="20" font-weight="700">FROM INTENTION TO IMPACT ON THE LOAN</text>

    <line x1="164" y1="438" x2="1032" y2="438" stroke="#b9d9c4" stroke-width="8" stroke-linecap="round"/>
    <path d="M1008 424l26 14-26 14" fill="none" stroke="#176b3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(164 438)">
      <circle r="34" fill="#eaf5ee" stroke="#176b3a" stroke-width="3"/>
      <rect x="-15" y="-13" width="30" height="26" rx="4" fill="none" stroke="#176b3a" stroke-width="3"/>
      <path d="M-15-4H15M-8-18v9M8-18v9" fill="none" stroke="#176b3a" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="65" text-anchor="middle" fill="#14532d" font-size="15" font-weight="800" letter-spacing="0.8">DUE DATE</text>
      <text x="0" y="88" text-anchor="middle" fill="#667085" font-size="14">contract date</text>
    </g>

    <g transform="translate(442 438)">
      <circle r="34" fill="#eaf5ee" stroke="#176b3a" stroke-width="3"/>
      <circle cx="-8" cy="1" r="12" fill="none" stroke="#176b3a" stroke-width="3"/>
      <path d="M5-11h15M13-19l8 8-8 8" fill="none" stroke="#176b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="65" text-anchor="middle" fill="#14532d" font-size="15" font-weight="800" letter-spacing="0.8">PAYMENT</text>
      <text x="0" y="88" text-anchor="middle" fill="#667085" font-size="14">funds sent</text>
    </g>

    <g transform="translate(720 438)">
      <circle r="34" fill="#eaf5ee" stroke="#176b3a" stroke-width="3"/>
      <path d="M0-17A17 17 0 0 1 15-8M17 0A17 17 0 0 1 8 15M0 17A17 17 0 0 1-15 8M-17 0A17 17 0 0 1-8-15" fill="none" stroke="#176b3a" stroke-width="4" stroke-linecap="round"/>
      <path d="M13-14l3 8-9-1M14 13l-8 3 1-9M-13 14l-3-8 9 1M-14-13l8-3-1 9" fill="#176b3a"/>
      <text x="0" y="65" text-anchor="middle" fill="#14532d" font-size="15" font-weight="800" letter-spacing="0.65">PROCESSING</text>
      <text x="0" y="88" text-anchor="middle" fill="#667085" font-size="14">posting confirmed</text>
    </g>

    <g transform="translate(998 438)">
      <circle r="38" fill="#176b3a" stroke="#14532d" stroke-width="3"/>
      <path d="M-18-9l12 10 10-8 15-12M19-19v11H8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-18 18h38" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="65" text-anchor="middle" fill="#14532d" font-size="15" font-weight="800" letter-spacing="0.8">LOWER BALANCE</text>
      <text x="0" y="88" text-anchor="middle" fill="#667085" font-size="14">principal reduced</text>
    </g>
  </g>
</svg>
